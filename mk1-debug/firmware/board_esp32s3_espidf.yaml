#
#  ESP32-S3 Board Configuration — esp-idf framework variant
#  Generic ESP32-S3-DevKitC-1 style board (e.g. "esp32-s3-technik-mk1" test rig)
#  Flash: 16MB. No PSRAM assumed — add a `psram:` block if your board has it.
#

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  variant: esp32s3
  flash_size: 16MB
