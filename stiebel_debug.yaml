# stiebel_debug.yaml - Debug-Paket fuer die Waermepumpen-Firmware (CAN-Status, Neustart-Infos).
#
# Zweck: CAN-/TWAI-Status per MQTT und Neustart-Infos des ESP als HA-Diagnose-Entitaeten.
# Nur Lesepfad. Den Roh-Frame-Mitschnitt (RX und TX) bringt die Firmware selbst mit (can_debug.h):
#   <topic_root>/can_debug/set on|off, Frames auf <topic_root>/can_debug/frames.
#
# Einbindung in die Firmware-YAML:
#   packages:
#     stiebel_debug: github://bastard-GIT/stiebel-debug/stiebel_debug.yaml@<tag>
#
# Substitutionen (Standardwerte unten, in der eigenen YAML ueberschreiben):
#   debug_can_status   "true"/"false": stiebel-debug/status (Zaehler, Heap, TWAI) und availability
#   debug_boot_info    "true"/"false": Neustart-Infos stiebel_mk1_* (Letzter Neustart, Neustart Grund,
#                      Laufzeit vor Neustart, Neustarts, Firmware Version, Firmware Build)
#
# Voraussetzungen:
#   - Waermepumpen-Firmware ha-stiebel-control mit canbus id my_can (TWAI oder MCP2515).
#   - Komponenten mqtt (id mqtt_client fuer boot_info.h; der Status nutzt ::esphome::mqtt::global_mqtt_client),
#     interval, time (SNTP, kommt aus common.yaml).
#
# MQTT-Topics:
#   stiebel-debug/status        Status alle 5 s (Felder siehe stiebel_debug/can_status.h)
#   stiebel-debug/availability  online (retained), alle 5 s und bei MQTT-Connect
#   <topic_root>/calculated/stiebel_mk1_*/state   Neustart-Infos (retained), Discovery unter homeassistant/sensor/

substitutions:
  debug_can_status: "true"
  debug_boot_info: "true"

esphome:
  includes:
    - stiebel_debug
  build_flags:
    - "-DSTIEBEL_DEBUG_STATUS_${debug_can_status}"
    - "-DSTIEBEL_DEBUG_BOOTINFO_${debug_boot_info}"

# Frame-Zaehler: zusaetzliches on_frame an my_can (!extend haengt die Liste an, ersetzt sie nicht).
canbus:
  - id: !extend my_can
    on_frame:
      - can_id: 0
        can_id_mask: 0
        then:
          - lambda: |-
              #ifdef STIEBEL_DEBUG_STATUS_true
              dbgstat_on_frame();
              #endif

mqtt:
  on_connect:
    - lambda: |-
        #ifdef STIEBEL_DEBUG_STATUS_true
        if (::esphome::mqtt::global_mqtt_client != nullptr)
          ::esphome::mqtt::global_mqtt_client->publish("stiebel-debug/availability", "online", 6, 1, true);
        #endif

interval:
  # Status auf stiebel-debug/status
  - interval: 5s
    then:
      - lambda: |-
          #ifdef STIEBEL_DEBUG_STATUS_true
          dbgstat_publish();
          #endif
  # Neustart-Infos einmal pro Start an HA; haelt crash_trace up_ms aktuell (boot_info.h)
  - interval: 1s
    then:
      - lambda: |-
          bootinfo::loop();
